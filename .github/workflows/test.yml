name: Test

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in dist/floorplan-*.js; do node --check "$f"; done
      - run: node --test tests/
